[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
# MoneyMarket's portfolio views need the IR pipeline (stack depth).
via_ir = true
# OpenZeppelin is installed via npm in the parent project, so Foundry needs
# permission to read outside the contracts/ directory.
allow_paths = ["../node_modules"]
remappings = [
    "@openzeppelin/contracts/=../node_modules/@openzeppelin/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 100
tab_width = 4
