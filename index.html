<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
    <title data-default>Proxy Swap — instant cross-chain swaps</title>
  </head>
  <body>
    <script>
      if (new URLSearchParams(location.search).has("mockwallet")) {
        window.ethereum = {
          request: async ({ method }) => {
            if (method === "eth_accounts" || method === "eth_requestAccounts")
              return ["0x86F173DABd543068f05D8c2e1f8eDCaEB2CBa1ca"];
            if (method === "eth_chainId") return "0xaa36a7";
            throw new Error("mock wallet is read-only");
          },
          on() {},
          removeListener() {},
        };
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
